[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supra-openai"
version = "0.1.0"
description = "OpenAI-compatible Images API server for SupraLabs/Supra2-IMG"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "diffusers>=0.27",
    "huggingface_hub>=0.23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/supra_openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
