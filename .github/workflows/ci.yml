name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: supra-openai:test-py${{ matrix.python }}
          build-args: PYTHON_VERSION=${{ matrix.python }}
          cache-from: type=gha,scope=test-py${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=test-py${{ matrix.python }}

      - name: Run tests
        run: docker run --rm supra-openai:test-py${{ matrix.python }} pytest -q
